name: Lark license expiry reminder

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the dashboard reminder
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 10 \
            --request POST \
            https://it-monthly-dashboard-new.onrender.com/internal/license-reminder/run
